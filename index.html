<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roulette des ouvertures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;500;700;800&family=Red+Hat+Mono:wght@400;600&display=swap">
<style>
/* Table de casino x club d'échecs : feutre vert, laiton, rouge roulette. Plateau à gauche, ticket + feuille à droite ; empilé sur mobile. */
:root {
  --bg: oklch(0.95 0.015 95); --surface: oklch(0.985 0.008 95); --fg: oklch(0.24 0.03 160); --muted: oklch(0.48 0.03 160); --line: oklch(0.86 0.02 110);
  --felt: oklch(0.42 0.08 158); --felt-deep: oklch(0.33 0.07 158);
  --brass: oklch(0.78 0.12 82); --brass-deep: oklch(0.62 0.11 72);
  --red: oklch(0.54 0.19 27); --red-deep: oklch(0.42 0.16 27); --on-red: oklch(0.97 0.02 90);
  --sq-light: oklch(0.93 0.04 100); --sq-dark: oklch(0.6 0.08 140);
  --hl: oklch(0.85 0.15 90 / .6); --sel: oklch(0.55 0.12 158 / .6); --ok: oklch(0.5 0.12 155); --bad: var(--red);
  --pocket-w: oklch(0.96 0.02 95); --pocket-b: oklch(0.2 0.02 160);
  --display: "Bungee", "Impact", system-ui, sans-serif;
  --body: "Figtree", system-ui, sans-serif;
  --mono: "Red Hat Mono", ui-monospace, monospace;
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: oklch(0.2 0.035 160); --surface: oklch(0.25 0.035 160); --fg: oklch(0.93 0.015 95); --muted: oklch(0.72 0.025 150); --line: oklch(0.35 0.035 160);
  --felt: oklch(0.31 0.06 158); --felt-deep: oklch(0.24 0.05 158);
  --brass: oklch(0.8 0.12 82); --brass-deep: oklch(0.6 0.1 72);
  --red: oklch(0.62 0.18 27); --red-deep: oklch(0.45 0.15 27);
  --sq-light: oklch(0.85 0.04 100); --sq-dark: oklch(0.53 0.07 140);
  --ok: oklch(0.75 0.13 155); --bad: oklch(0.72 0.15 27); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: oklch(0.2 0.035 160); --surface: oklch(0.25 0.035 160); --fg: oklch(0.93 0.015 95); --muted: oklch(0.72 0.025 150); --line: oklch(0.35 0.035 160);
  --felt: oklch(0.31 0.06 158); --felt-deep: oklch(0.24 0.05 158);
  --brass: oklch(0.8 0.12 82); --brass-deep: oklch(0.6 0.1 72);
  --red: oklch(0.62 0.18 27); --red-deep: oklch(0.45 0.15 27);
  --sq-light: oklch(0.85 0.04 100); --sq-dark: oklch(0.53 0.07 140);
  --ok: oklch(0.75 0.13 155); --bad: oklch(0.72 0.15 27); color-scheme: dark }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 16px/1.5 var(--body); padding: 24px 16px 48px; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.wrap { max-width: 1060px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 560px) minmax(0, 1fr); gap: 24px 40px; align-items: start; }
@media (max-width: 860px) { .wrap { grid-template-columns: minmax(0, 1fr); } }

/* En-tête : enseigne de foire avec une rangée d'ampoules qui clignotent pendant le tirage */
header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: end; justify-content: space-between; }
h1 { font: 400 clamp(26px, 5vw, 44px)/1 var(--display); margin: 0; letter-spacing: .01em; color: var(--fg); padding-bottom: 16px;
  background: radial-gradient(circle, var(--brass) 2.5px, transparent 3px) 0 100% / 16px 10px repeat-x; }
h1 span { color: var(--red); }
.spinning h1 { animation: bulbs .24s steps(2) infinite; }
@keyframes bulbs { to { background-position: 8px 100%; } }

/* Filtre : jetons de mise */
.seg { display: inline-flex; gap: 6px; }
.seg button { border: 2px dashed var(--line); background: var(--surface); color: var(--muted); font-weight: 700; font-size: 14px; padding: 8px 14px; border-radius: 999px; cursor: pointer; transition: transform .15s var(--ease-out), border-color .15s; }
.seg button:hover { border-color: var(--brass-deep); }
.seg button[aria-pressed="true"] { background: var(--felt); color: var(--on-red); border: 2px dashed var(--brass); }
.seg button:active { transform: scale(.95); }

/* Plateau posé sur un tapis de feutre cerclé de laiton */
.mat { background: var(--felt); padding: clamp(8px, 2vw, 16px); border-radius: 16px; box-shadow: inset 0 0 0 2px var(--brass-deep), inset 0 0 0 6px var(--felt), inset 0 0 0 7px oklch(0.78 0.12 82 / .35), 0 18px 40px -18px oklch(0.2 0.05 160 / .6); }
.board { position: relative; display: grid; grid-template: repeat(8, minmax(0, 1fr)) / repeat(8, minmax(0, 1fr)); width: 100%; aspect-ratio: 1; border-radius: 4px; overflow: hidden; user-select: none; box-shadow: 0 0 0 2px var(--felt-deep); }
.board.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.sq { position: relative; display: grid; place-items: center; cursor: pointer; }
.sq.l { background: var(--sq-light); } .sq.d { background: var(--sq-dark); }
.sq.last::before, .sq.sel::before, .sq.hint::before { content: ""; position: absolute; inset: 0; }
.sq.last::before { background: var(--hl); } .sq.sel::before { background: var(--sel); }
.sq.hint::before { box-shadow: inset 0 0 0 4px var(--red); }
.sq.dot::after { content: ""; position: absolute; width: 28%; height: 28%; border-radius: 50%; background: oklch(0.2 0.03 160 / .25); }
.pc { position: relative; font-size: min(9.5vw, 54px); line-height: 1; font-variant-emoji: text; }
.pc.w { color: oklch(0.98 0.01 95); text-shadow: 0 0 1px oklch(0.15 0.02 160), 0 0 1px oklch(0.15 0.02 160), 0 1px 2px oklch(0.15 0.02 160 / .6); }
.pc.b { color: oklch(0.2 0.02 160); text-shadow: 0 0 1px oklch(1 0 0 / .4); }
.coord { position: absolute; font: 600 10px var(--mono); opacity: .75; pointer-events: none; }
.coord.f { right: 3px; bottom: 1px; } .coord.r { left: 3px; top: 2px; }
.sq.l .coord { color: var(--sq-dark); } .sq.d .coord { color: var(--sq-light); }

.nav { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
.nav button { width: 44px; height: 44px; font-weight: 700; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); cursor: pointer; font-size: 14px; transition: border-color .15s, transform .15s var(--ease-out); }
.nav button:hover { border-color: var(--brass-deep); }
.nav button:active { transform: scale(.92); }

.panel { display: grid; gap: 28px; min-width: 0; }

/* Ticket de tirage : poche de roulette (code ECO) + fenêtre de rouleau pour le nom */
.ticket { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 18px; align-items: center; }
.ticket::before, .ticket::after { content: ""; position: absolute; top: 50%; width: 18px; height: 18px; margin-top: -9px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); }
.ticket::before { left: -10px; clip-path: inset(0 0 0 50%); } .ticket::after { right: -10px; clip-path: inset(0 50% 0 0); }
.pocket { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font: 600 15px var(--mono); grid-row: span 2;
  background: var(--pocket-w); color: var(--pocket-b); box-shadow: 0 0 0 3px var(--brass), 0 0 0 6px var(--surface), 0 0 0 7px var(--line); }
.pocket.b { background: var(--pocket-b); color: var(--pocket-w); }
.side { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); align-self: end; }
.reel { overflow: hidden; align-self: start; }
h2 { font: 800 clamp(22px, 2.6vw, 28px)/1.15 var(--body); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.tick h2 { animation: tick .07s linear; filter: blur(.6px); }
.land h2 { animation: land .5s var(--ease-out); }
.land .pocket { animation: pop .5s var(--ease-out); }
@keyframes tick { from { transform: translateY(-70%); opacity: .3; } }
@keyframes land { from { transform: translateY(-40%); opacity: 0; } }
@keyframes pop { 40% { transform: scale(1.12) rotate(-12deg); } }
.idea { grid-column: 1 / -1; margin: 14px 0 0; padding-top: 14px; border-top: 1px dashed var(--line); color: var(--muted); max-width: 62ch; }
.spinning .idea { opacity: 0; }

/* Feuille de notation */
.sheet { display: grid; gap: 14px; }
.label { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0; }
.moves { font: 400 15px/2 var(--mono); display: flex; flex-wrap: wrap; gap: 0 2px; }
.moves .n { color: var(--muted); margin-left: 8px; }
.moves .n:first-child { margin-left: 0; }
.moves button { border: 0; background: none; padding: 0 5px; border-radius: 6px; cursor: pointer; }
.moves button:hover { background: var(--line); }
.moves button.cur { background: var(--brass); color: var(--pocket-b); font-weight: 600; }
.moves button.future { color: var(--muted); opacity: .5; }
.moves.hidden button.future { visibility: hidden; }
.status { font-weight: 700; min-height: 1.5em; margin: 0; }
.status.ok { color: var(--ok); } .status.bad { color: var(--bad); }
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.roll { font: 400 18px var(--display); letter-spacing: .02em; background: var(--red); color: var(--on-red); border: 0; padding: 14px 26px; border-radius: 999px; cursor: pointer;
  box-shadow: 0 0 0 3px var(--brass), 0 5px 0 3px var(--brass-deep); transition: transform .12s var(--ease-out), box-shadow .12s var(--ease-out); }
.roll:hover { background: color-mix(in oklch, var(--red), white 8%); }
.roll:active { transform: translateY(4px); box-shadow: 0 0 0 3px var(--brass), 0 1px 0 3px var(--brass-deep); }
.ghost { font-weight: 700; background: none; border: 2px solid var(--line); padding: 12px 20px; border-radius: 999px; cursor: pointer; transition: border-color .15s; }
.ghost:hover { border-color: var(--felt); }
.score { font: 400 13px var(--mono); color: var(--muted); }
button:focus-visible { outline: 3px solid var(--brass); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Roulette <span>des</span> ouvertures</h1>
    <div class="seg" role="group" aria-label="Couleur">
      <button id="f-all" data-f="all" aria-pressed="true">Les deux</button>
      <button id="f-w" data-f="w" aria-pressed="false">Blancs</button>
      <button id="f-b" data-f="b" aria-pressed="false">Noirs</button>
    </div>
  </header>

  <div>
    <div class="mat"><div class="board" id="board" aria-label="Échiquier"></div></div>
    <div class="nav">
      <button id="first" aria-label="Début">«</button>
      <button id="prev" aria-label="Coup précédent">◀</button>
      <button id="next" aria-label="Coup suivant">▶</button>
      <button id="last" aria-label="Fin">»</button>
    </div>
  </div>

  <div class="panel">
    <div class="ticket" id="ticket" aria-live="polite">
      <div class="pocket" id="eco"></div>
      <div class="side" id="side"></div>
      <div class="reel"><h2 id="name"></h2></div>
      <p class="idea" id="idea"></p>
    </div>
    <div class="sheet">
      <p class="label">Ligne principale</p>
      <div class="moves" id="moves"></div>
      <p class="status" id="status"></p>
      <div class="actions">
        <button class="roll" id="roll">Tirer !</button>
        <button class="ghost" id="train">S'entraîner</button>
      </div>
      <div class="score" id="score"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js" integrity="sha384-aH7F59TKSh8OEAivbclch9UUnWn/Uy8AQlYYKzpVaQkAp8W6IF2VocW/knEeRwT0" crossorigin="anonymous"></script>
<script>
// side = la couleur qui choisit l'ouverture (w: ouverture des Blancs, b: défense des Noirs)
const OPENINGS = [
  { n: "Partie italienne (Giuoco Piano)", eco: "C54", side: "w", line: "e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d4 exd4 cxd4 Bb4+",
    idea: "Développement rapide, fou en c4 qui vise f7, puis c3-d4 pour bâtir un grand centre." },
  { n: "Partie espagnole (Ruy Lopez)", eco: "C84", side: "w", line: "e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Be7 Re1 b5 Bb3 d6",
    idea: "Le fou b5 met la pression sur le défenseur de e5. Partie lente et stratégique, très solide." },
  { n: "Partie écossaise", eco: "C45", side: "w", line: "e4 e5 Nf3 Nc6 d4 exd4 Nxd4 Bc5 Be3 Qf6 c3 Nge7",
    idea: "On ouvre le centre tout de suite avec d4. Jeu ouvert, pièces actives, peu de théorie à retenir." },
  { n: "Gambit Evans", eco: "C51", side: "w", line: "e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bxb4 c3 Ba5 d4 exd4 O-O",
    idea: "On sacrifie le pion b pour gagner du temps et ouvrir le centre. Attaque garantie contre f7." },
  { n: "Gambit du roi", eco: "C39", side: "w", line: "e4 e5 f4 exf4 Nf3 g5 h4 g4 Ne5",
    idea: "Romantique : on donne le pion f pour ouvrir la colonne f et attaquer le roi noir. Très tranchant." },
  { n: "Partie viennoise", eco: "C29", side: "w", line: "e4 e5 Nc3 Nf6 f4 d5 fxe5 Nxe4 Nf3 Be7",
    idea: "Cavalier c3 d'abord, puis f4 : un gambit du roi mieux préparé." },
  { n: "Gambit dame décliné", eco: "D55", side: "w", line: "d4 d5 c4 e6 Nc3 Nf6 Bg5 Be7 e3 O-O Nf3 h6",
    idea: "c4 attaque le centre noir. Les Blancs prennent de l'espace et clouent le cavalier avec Fg5." },
  { n: "Système de Londres", eco: "D02", side: "w", line: "d4 d5 Bf4 Nf6 e3 c5 c3 Nc6 Nd2 e6 Ngf3 Bd6 Bg3",
    idea: "Toujours le même schéma (d4, Ff4, e3, c3) quoi que fassent les Noirs. Idéal pour peu de théorie." },
  { n: "Ouverture catalane", eco: "E04", side: "w", line: "d4 Nf6 c4 e6 g3 d5 Bg2 dxc4 Nf3 c5 O-O Nc6",
    idea: "Le fou en g2 vise la grande diagonale. On rend parfois le pion c4 pour une pression durable." },
  { n: "Ouverture anglaise", eco: "A29", side: "w", line: "c4 e5 Nc3 Nf6 Nf3 Nc6 g3 d5 cxd5 Nxd5 Bg2 Nb6",
    idea: "Une sicilienne avec un temps de plus. Contrôle du centre à distance, jeu de position." },
  { n: "Ouverture Réti", eco: "A07", side: "w", line: "Nf3 d5 g3 Nf6 Bg2 e6 O-O Be7 d3 O-O",
    idea: "On laisse les Noirs occuper le centre pour l'attaquer ensuite avec c4 ou e4. Flexible." },

  { n: "Sicilienne Najdorf", eco: "B90", side: "b", line: "e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Be3 e5 Nb3 Be6",
    idea: "La défense de combat par excellence. a6 prépare ...e5 ou ...b5, jeu sur l'aile dame." },
  { n: "Sicilienne Dragon", eco: "B76", side: "b", line: "e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 g6 Be3 Bg7 f3 O-O",
    idea: "Fou en fianchetto sur la grande diagonale. Souvent roques opposés et course à l'attaque." },
  { n: "Défense française", eco: "C14", side: "b", line: "e4 e6 d4 d5 Nc3 Nf6 Bg5 Be7 e5 Nfd7 Bxe7 Qxe7",
    idea: "Solide mais un peu passive. On attaque la chaîne de pions blanche avec ...c5 et ...f6." },
  { n: "Défense Caro-Kann", eco: "B19", side: "b", line: "e4 c6 d4 d5 Nc3 dxe4 Nxe4 Bf5 Ng3 Bg6 h4 h6 Nf3 Nd7",
    idea: "Comme la française, mais le fou c8 sort avant ...e6. Structure saine, finales confortables." },
  { n: "Défense scandinave", eco: "B01", side: "b", line: "e4 d5 exd5 Qxd5 Nc3 Qa5 d4 Nf6 Nf3 Bf5 Bc4 e6",
    idea: "On conteste e4 dès le premier coup. La dame sort tôt mais se replie en a5, plan simple." },
  { n: "Défense Petrov", eco: "C42", side: "b", line: "e4 e5 Nf3 Nf6 Nxe5 d6 Nf3 Nxe4 d4 d5 Bd3 Nc6",
    idea: "On contre-attaque e4 au lieu de défendre e5. Très solide, réputée pour annuler." },
  { n: "Défense Alekhine", eco: "B03", side: "b", line: "e4 Nf6 e5 Nd5 d4 d6 c4 Nb6 exd6 cxd6",
    idea: "On provoque les pions blancs pour qu'ils avancent, puis on les attaque comme cibles." },
  { n: "Défense Pirc", eco: "B07", side: "b", line: "e4 d6 d4 Nf6 Nc3 g6 Nf3 Bg7 Be2 O-O O-O c6",
    idea: "Hypermoderne : on laisse le centre aux Blancs puis on le sape avec ...e5 ou ...c5." },
  { n: "Défense est-indienne", eco: "E97", side: "b", line: "d4 Nf6 c4 g6 Nc3 Bg7 e4 d6 Nf3 O-O Be2 e5 O-O Nc6 d5 Ne7",
    idea: "Les Blancs jouent à l'aile dame, les Noirs lancent ...f5 et attaquent le roi. Très dynamique." },
  { n: "Défense nimzo-indienne", eco: "E32", side: "b", line: "d4 Nf6 c4 e6 Nc3 Bb4 Qc2 O-O a3 Bxc3+ Qxc3 b6",
    idea: "Le clouage Fb4 empêche e4. On accepte de donner la paire de fous pour abîmer les pions blancs." },
  { n: "Défense slave", eco: "D17", side: "b", line: "d4 d5 c4 c6 Nf3 Nf6 Nc3 dxc4 a4 Bf5 e3 e6 Bxc4 Bb4",
    idea: "On soutient d5 avec c6 sans enfermer le fou c8. Solide et simple à jouer." },
  { n: "Défense Grünfeld", eco: "D85", side: "b", line: "d4 Nf6 c4 g6 Nc3 d5 cxd5 Nxd5 e4 Nxc3 bxc3 Bg7 Nf3 c5",
    idea: "On laisse les Blancs bâtir un grand centre pour le bombarder avec le fou g7 et ...c5." },
  { n: "Défense hollandaise", eco: "A87", side: "b", line: "d4 f5 Nf3 Nf6 g3 g6 Bg2 Bg7 O-O O-O c4 d6",
    idea: "...f5 contrôle e4 et prépare une attaque à l'aile roi. Ambitieuse, un peu risquée." },
  { n: "Benoni moderne", eco: "A70", side: "b", line: "d4 Nf6 c4 c5 d5 e6 Nc3 exd5 cxd5 d6 e4 g6 Nf3 Bg7",
    idea: "Déséquilibre immédiat : majorité à l'aile dame pour les Noirs, centre pour les Blancs." },
];

const GLYPH = { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" };
const $ = id => document.getElementById(id);
const game = new Chess();
let filter = "all", cur = null, moves = [], ply = 0, mode = "view", sel = null, errors = 0, timer = null;
let score = { ok: 0, total: 0 };

function load(o) {
  cur = o; moves = o.line.split(" "); mode = "view"; sel = null;
  $("eco").textContent = o.eco;
  $("eco").className = "pocket " + o.side;
  $("side").textContent = o.side === "w" ? "Avec les Blancs" : "Avec les Noirs";
  $("name").textContent = o.n;
  $("idea").textContent = o.idea;
  setStatus("");
  goTo(moves.length);
}

// Rouleau : les noms défilent en ralentissant puis s'arrêtent sur le tirage. Instantané si mouvement réduit.
let spinning = false;
function roll() {
  if (spinning) return;
  const pool = OPENINGS.filter(o => (filter === "all" || o.side === filter) && o !== cur);
  const pick = pool[Math.floor(Math.random() * pool.length)];
  if (!cur || matchMedia("(prefers-reduced-motion: reduce)").matches) return load(pick);
  spinning = true; clearTimeout(timer); mode = "view"; sel = null; setStatus("");
  const t = $("ticket"); document.body.classList.add("spinning"); t.classList.remove("land");
  let i = 0;
  (function tick() {
    if (i++ < 14) {
      const o = pool[i % pool.length];
      $("name").textContent = o.n; $("eco").textContent = o.eco;
      t.classList.remove("tick"); void t.offsetWidth; t.classList.add("tick");
      return setTimeout(tick, 40 + i * i * 1.4);
    }
    t.classList.remove("tick"); document.body.classList.remove("spinning");
    load(pick); void t.offsetWidth; t.classList.add("land"); spinning = false;
  })();
}

function goTo(n) {
  clearTimeout(timer);
  game.reset();
  for (let i = 0; i < n; i++) game.move(moves[i], { sloppy: true });
  ply = n; render();
}

function render() {
  const b = $("board"); b.innerHTML = "";
  const files = "abcdefgh", flip = cur.side === "b";
  const last = game.history({ verbose: true }).pop();
  const dots = sel ? game.moves({ square: sel, verbose: true }).map(m => m.to) : [];
  const hintSq = mode === "train" && errors > 0 && ply < moves.length ? expected()?.from : null;
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
    const file = flip ? 7 - f : f, rank = flip ? r + 1 : 8 - r;
    const sq = files[file] + rank, d = document.createElement("div");
    d.className = "sq " + ((file + rank) % 2 ? "l" : "d");
    if (last && (sq === last.from || sq === last.to)) d.classList.add("last");
    if (sq === sel) d.classList.add("sel");
    if (dots.includes(sq)) d.classList.add("dot");
    if (sq === hintSq) d.classList.add("hint");
    const p = game.get(sq);
    if (p) d.innerHTML = `<span class="pc ${p.color}">${GLYPH[p.type]}&#xFE0E;</span>`;
    if (f === 7) d.insertAdjacentHTML("beforeend", `<span class="coord r">${rank}</span>`);
    if (r === 7) d.insertAdjacentHTML("beforeend", `<span class="coord f">${files[file]}</span>`);
    d.onclick = () => click(sq);
    b.appendChild(d);
  }
  const mv = $("moves"); mv.innerHTML = "";
  mv.classList.toggle("hidden", mode === "train");
  moves.forEach((m, i) => {
    if (i % 2 === 0) mv.insertAdjacentHTML("beforeend", `<span class="n">${i / 2 + 1}.</span>`);
    const btn = document.createElement("button");
    btn.textContent = m;
    if (i === ply - 1) btn.className = "cur"; else if (i >= ply) btn.className = "future";
    btn.onclick = () => { if (mode === "view") goTo(i + 1); };
    mv.appendChild(btn);
  });
  $("train").textContent = mode === "train" ? "Arrêter" : "S'entraîner";
  $("score").textContent = score.total ? `Lignes réussies sans faute : ${score.ok} / ${score.total}` : "";
}

function expected() {
  const m = game.move(moves[ply], { sloppy: true });
  if (m) game.undo();
  return m;
}

function setStatus(t, cls = "") { const s = $("status"); s.textContent = t; s.className = "status " + cls; }

function startTrain() {
  mode = "train"; errors = 0; sel = null; cur.clean = true;
  goTo(0);
  setStatus(cur.side === "w" ? "À toi de jouer les coups blancs." : "À toi de jouer les coups noirs.");
  step();
}

function step() {
  if (ply >= moves.length) {
    mode = "view"; score.total++; if (cur.clean) score.ok++;
    setStatus(cur.clean ? "Ligne jouée sans faute." : "Ligne terminée. Rejoue-la pour la jouer sans faute.", "ok");
    render(); return;
  }
  render();
  if (game.turn() !== cur.side) timer = setTimeout(() => { game.move(moves[ply], { sloppy: true }); ply++; step(); }, 450);
}

function click(sq) {
  if (mode !== "train" || game.turn() !== cur.side || ply >= moves.length) return;
  const p = game.get(sq);
  if (sel && sel !== sq && game.moves({ square: sel, verbose: true }).some(m => m.to === sq)) {
    const exp = expected(), from = sel;
    sel = null;
    if (exp.from === from && exp.to === sq) {
      game.move(moves[ply], { sloppy: true }); ply++; errors = 0;
      setStatus("Bien joué : " + exp.san, "ok"); step();
    } else {
      errors++; cur.clean = false;
      $("board").classList.remove("shake"); void $("board").offsetWidth; $("board").classList.add("shake");
      setStatus(errors >= 2 ? `Pas ça. Le coup attendu est ${exp.san}.` : "Pas le coup de la ligne. La pièce à jouer est encadrée.", "bad");
      render();
    }
    return;
  }
  sel = p && p.color === cur.side && sel !== sq ? sq : null;
  render();
}

document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
  filter = b.dataset.f;
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
  try { localStorage.setItem("filter", filter); } catch {}
  if (!cur || (filter !== "all" && cur.side !== filter)) roll();
});
$("roll").onclick = roll;
$("train").onclick = () => spinning ? 0 : mode === "train" ? (mode = "view", sel = null, setStatus(""), goTo(moves.length)) : startTrain();
const nav = n => { if (mode === "view") goTo(Math.max(0, Math.min(moves.length, n))); };
$("first").onclick = () => nav(0);
$("prev").onclick = () => nav(ply - 1);
$("next").onclick = () => nav(ply + 1);
$("last").onclick = () => nav(moves.length);
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") nav(ply - 1);
  if (e.key === "ArrowRight") nav(ply + 1);
});

try { const f = localStorage.getItem("filter"); if (f) $("f-" + f)?.click(); } catch {}
if (!cur) roll();
</script>
</body>
</html>
